[project]
name = "financial-services"
version = "0.1.0"
description = "Customer Data Product — Financial Services."
authors = []
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "httpx>=0.27.0,<1.0.0",
    "streamlit>=1.40.0,<2.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
]

[tool.poetry]
packages = [{ include = "customer_data_product", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
ruff = "^0.6.9"
mypy = "^1.11.2"
faker = "^40.38.0"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
