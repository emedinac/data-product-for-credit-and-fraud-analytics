services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://customer:customer@postgres:5432/customer_product
      PORT: 8000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: customer_product
      POSTGRES_USER: customer
      POSTGRES_PASSWORD: customer
    ports:
      - "5432:5432"
    volumes:
      - customer_product_postgres:/var/lib/postgresql/data

  airflow:
    build: ./airflow
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      DATABASE_URL: postgresql://customer:customer@postgres:5432/customer_product
      LAKE_ROOT: /opt/project/lake
      RAW_ROOT: /opt/project/raw_dev
      PYTHONPATH: /opt/project/src
    ports:
      - "8080:8080"
    volumes:
      - airflow_home:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/project
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  customer_product_postgres:
  airflow_home:
