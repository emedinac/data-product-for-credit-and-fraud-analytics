services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://customer:customer@postgres:5432/customer_product
      PORT: 8000
      AUTH_MODE: "${AUTH_MODE:-google}"
      LOCAL_AUTH_TOKEN: "${LOCAL_AUTH_TOKEN:-}"
      AUTH_AUDIENCE: "${AUTH_AUDIENCE:-}"
      AUTH_ROLE_BINDINGS: "${AUTH_ROLE_BINDINGS:-}"
      AUTH_CONSUMER_ENTITLEMENTS: "${AUTH_CONSUMER_ENTITLEMENTS:-}"
      ENABLE_GROUND_TRUTH: "${ENABLE_GROUND_TRUTH:-false}"
      STORAGE_BACKEND: "${STORAGE_BACKEND:-local}"
      RAW_ROOT: "${RAW_ROOT:-raw_dev}"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./lake:/app/lake
    depends_on:
      - postgres

  worker:
    build: .
    command: python -m customer_data_product.worker
    environment:
      DATABASE_URL: postgresql://customer:customer@postgres:5432/customer_product
      LAKE_ROOT: lake
      PROCESSING_MAX_ATTEMPTS: "${PROCESSING_MAX_ATTEMPTS:-3}"
      BASE_CURRENCY: "${BASE_CURRENCY:-USD}"
      EXCHANGE_RATES: "${EXCHANGE_RATES:-{}}"
      EXCHANGE_RATE_SOURCE: "${EXCHANGE_RATE_SOURCE:-configured}"
      EXCHANGE_RATE_MAX_AGE_SECONDS: "${EXCHANGE_RATE_MAX_AGE_SECONDS:-86400}"
    volumes:
      - ./lake:/app/lake
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: customer_product
      POSTGRES_USER: customer
      POSTGRES_PASSWORD: customer
    ports:
      - "5432:5432"
    volumes:
      - customer_product_postgres:/var/lib/postgresql/data

  airflow:
    build: ./airflow
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      DATABASE_URL: postgresql://customer:customer@postgres:5432/customer_product
      LAKE_ROOT: /opt/project/lake
      RAW_ROOT: /opt/project/raw_dev
      PYTHONPATH: /opt/project/src
    ports:
      - "8080:8080"
    volumes:
      - airflow_home:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/project
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS_ENABLED:-false}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "${GRAFANA_DISABLE_LOGIN_FORM:-false}"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  customer_product_postgres:
  airflow_home:
